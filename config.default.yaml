# copilot-relay configuration
#
# This file is copied to ~/.copilot-relay/config.yaml on first start.
# Edit the user config file, not this template, for local changes.
# Valid complete edits hot-reload without rewriting this file.
# host, port, claudeSetup, and upstreamProxy require restart.
#
# Values here apply to a fresh install only. copilot-relay writes the resolved
# config back to disk, so once a key exists in your config.yaml it is yours:
# changing a shipped default never rewrites it.

# Local host for the Claude Code-compatible HTTP server.
host: 127.0.0.1

# Local port for the HTTP server.
port: 4142

# Optional key that every client request must carry, as x-api-key or
# Authorization: Bearer. GET /healthz and GET|HEAD /api/hello stay open.
# Empty disables it. A set key is at least 16 visible ASCII characters;
# quote one that starts with #. Set a key before binding host beyond
# loopback: otherwise any client that reaches the port can use your
# Copilot account. Changes hot-reload, but a client keeps the token it
# loaded, so update and restart clients after changing it.
apiKey:

# GitHub Copilot API base URL.
# Keep this default unless you know your Copilot tenant uses a custom endpoint.
copilotBaseUrl: https://api.githubcopilot.com

# Outbound proxy for Copilot and GitHub calls, including sign-in.
# Leave empty to connect directly.
# env uses HTTPS_PROXY, HTTP_PROXY and NO_PROXY. A background service does not
# inherit your shell's variables, so prefer a URL there.
# A URL looks like http://proxy.example:3128 or https://user:password@proxy.example:3128;
# percent-encode reserved characters in the user name and password.
upstreamProxy:

# When true, start updates ~/.claude/settings.json with ANTHROPIC_BASE_URL
# and ANTHROPIC_AUTH_TOKEN so Claude Code can use this proxy. The token is
# apiKey when it is set; otherwise a dummy token is written if none is present.
# Also seeds context/output budgets from model discovery, and
# CLAUDE_CODE_AUTO_MODE_SERVER=0, when not already set.
claudeSetup: true

# Log verbosity:
#   error - startup/preflight/request failures only
#   info  - errors plus status, model/effort and semantic completion summaries
#   debug - info plus full private bodies in ~/.copilot-relay/captures; may contain secrets
# Any other value is invalid and stops startup.
logLevel: info

# Number of days to keep relay logs and settled debug captures.
# Counted in local calendar days: 3 keeps today plus the previous two days.
# The active log file is copilot-relay.<local-date>.log and rotates at local
# midnight, which is what makes this setting take effect at all.
logRetentionDays: 3

# Fallback upstream effort when Claude Code does not specify one.
# Request output_config.effort wins, followed by legacy reasoning_effort.
# Valid values: low, medium, high, xhigh, max.
thinkEffort: max

# Max seconds to wait for one Claude request's upstream Copilot calls.
# Set 0 to disable the relay deadline for very long requests. Client cancellation
# and upstream/provider limits still apply.
upstreamTimeoutSeconds: 180

# Copilot model used for bridge-managed Claude WebSearch.
# Leave empty to use gptModel.
webSearchBackend:

# Claude upstream protocol: auto selects advertised native Messages support.
# Keep the proven chat route until native cache non-regression is measured.
# Explicit alternatives: auto, messages.
claudeUpstreamApi: chat-completions

# Model routing: requests containing "opus" use opusModel; all others use gptModel.
#
# Upstream Copilot model used for non-Opus requests.
gptModel: gpt-6-astra

# Upstream Copilot model used for requests containing "opus".
opusModel: claude-opus-5.5
