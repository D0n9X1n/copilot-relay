name: Publish wiki

# The wiki tab stays live, but its content is owned by wiki/ in this repo, so a
# doc change is reviewed in the same PR as the code it describes. This publishes
# that folder to the wiki tab on merge.
#
# One-way. Edits made in the wiki tab's browser editor are overwritten on the
# next push to wiki/ - edit wiki/ instead.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/publish-wiki.py"
      - "scripts/publish-wiki_tests.py"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test wiki publishing
        run: python3 scripts/publish-wiki_tests.py

      - name: Clone the wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki-repo

      - name: Publish wiki/ to the wiki tab
        shell: bash
        run: |
          set -euo pipefail

          # One implementation for CI and publishing: validate flat navigation,
          # preserve code examples, rename README and remove only stale page files.
          python3 scripts/publish-wiki.py build wiki wiki-repo
          python3 scripts/publish-wiki.py verify wiki-repo

          cd wiki-repo

          git add -A
          if git diff --cached --quiet; then
            echo "wiki tab already matches wiki/; nothing to publish"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish wiki from ${GITHUB_SHA::7}

          Source of truth is wiki/ in the code repo. Do not edit here - browser
          edits are overwritten on the next publish."

          git push origin HEAD
