name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.0.2"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build release assets
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          (cd release && sha256sum *.tgz > SHA256SUMS)
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${RELEASE_TAG}"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          python3 scripts/release-notes.py "$tag" release > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file"
            gh release upload "$tag" release/*.tgz release/SHA256SUMS --clobber
          else
            gh release create "$tag" release/*.tgz release/SHA256SUMS \
              --title "$tag" \
              --notes-file "$notes_file"
          fi

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11
      - run: npm install --no-audit --no-fund
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on npm; skipping."
          else
            npm publish --access public
          fi

  publish-github:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm install --no-audit --no-fund
      - name: Publish to GitHub Packages
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_version="$(node -p "require('./package.json').version")"
          npm pkg set "name=@${owner}/copilot-relay"
          package_name="@${owner}/copilot-relay"
          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on GitHub Packages; skipping."
          else
            npm publish --access public --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
